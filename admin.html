<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - شركة ZEN CLEAN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        
        body { background: #1a1a2e; color: white; min-height: 100vh; }
        
        .login-screen { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-direction: column;
            gap: 20px;
        }
        
        .login-box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .login-box h2 { margin-bottom: 20px; color: #00d4ff; }
        
        .login-box input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .login-btn {
            background: #00d4ff;
            color: #1a1a2e;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        
        .admin-panel { display: none; padding: 20px; }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-card .number { font-size: 40px; color: #00d4ff; font-weight: bold; }
        .stat-card .label { font-size: 14px; opacity: 0.8; }
        
        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .orders-list { display: flex; flex-direction: column; gap: 15px; }
        
        .order-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            border-right: 4px solid #00d4ff;
        }
